<!doctype html>
<!--
  Icône « Mnémé » : la muse de face, en dessin au trait néoclassique (ivoire sur
  l'encre bleu nuit de l'app), chevelure en mèches ondulées depuis une raie au
  milieu, diadème, et son attribut : le rouleau (volumen), mémoire écrite.
  Frise de grecques en bas.
  ?safe=1 → version « maskable » : motif réduit dans la zone sûre.
  Rendu en PNG par generate-icons.mjs (Chrome headless).
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; }
  svg { display: block; }
  .ink { fill: none; stroke: #efe0c4; stroke-linecap: round; stroke-linejoin: round; }
  .gold { fill: none; stroke: #e0b866; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="night" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#27426a"/>
      <stop offset="1" stop-color="#16263d"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#night)"/>

  <g id="portrait">
    <g id="hair"></g>

    <!-- Cou et drapé (chiton) -->
    <path class="ink" stroke-width="5.5" d="M 470 628 C 472 664, 470 692, 464 722 M 554 628 C 552 664, 554 692, 560 722"/>
    <path class="ink" stroke-width="5.5" d="M 464 722 C 416 736, 344 756, 306 808 M 560 722 C 608 736, 680 756, 718 808"/>
    <path class="ink" stroke-width="4.1" d="M 436 732 C 466 768, 558 768, 588 732 M 460 756 C 488 786, 536 786, 564 756"/>

    <!-- Visage : contour, ligne du front, sourcils prolongés par le nez (profil grec vu de face) -->
    <path class="ink" stroke-width="6.2" d="M 390 436 C 390 520, 420 590, 470 626 C 490 640, 500 646, 512 646 C 524 646, 534 640, 554 626 C 604 590, 634 520, 634 436"/>
    <path class="ink" stroke-width="4.1" d="M 416 442 C 440 424, 474 422, 498 436 C 504 470, 502 510, 494 540"/>
    <path class="ink" stroke-width="4.1" d="M 608 442 C 584 424, 550 422, 526 436 C 520 470, 522 510, 530 540"/>
    <path class="ink" stroke-width="4.1" d="M 486 546 C 494 560, 506 562, 512 556 C 518 562, 530 560, 538 546"/>
    <g id="eyes"></g>
    <!-- Bouche : arc de Cupidon, lèvre inférieure, creux du menton -->
    <path class="ink" stroke-width="4.1" d="M 474 590 C 490 582, 502 580, 512 586 C 522 580, 534 582, 550 590"/>
    <path class="ink" stroke-width="4.1" d="M 474 590 C 494 596, 530 596, 550 590"/>
    <path class="ink" stroke-width="3.4" d="M 486 604 C 500 612, 524 612, 538 604"/>
    <path class="ink" stroke-width="2.8" d="M 500 626 C 508 630, 516 630, 524 626"/>

    <!-- Diadème -->
    <g id="diadem"></g>

    <!-- Attribut : le rouleau (volumen), tenu devant le buste -->
    <g id="scroll"></g>
  </g>

  <g id="frieze"></g>
</svg>
<script>
  const svgNS = "http://www.w3.org/2000/svg";
  const add = (parent, tag, attributes) => {
    const element = document.createElementNS(svgNS, tag);
    for (const [name, value] of Object.entries(attributes)) element.setAttribute(name, value);
    document.getElementById(parent).appendChild(element);
    return element;
  };

  /** Point d'une courbe de Bézier cubique. */
  const bezier = (p0, p1, p2, p3, t) => {
    const u = 1 - t;
    return [
      u ** 3 * p0[0] + 3 * u ** 2 * t * p1[0] + 3 * u * t ** 2 * p2[0] + t ** 3 * p3[0],
      u ** 3 * p0[1] + 3 * u ** 2 * t * p1[1] + 3 * u * t ** 2 * p2[1] + t ** 3 * p3[1],
    ];
  };

  /** Mèche ondulée : une courbe de Bézier perturbée d'une légère ondulation le long de sa normale. */
  function wavyStrand(p0, p1, p2, p3, amplitude, waves, phase) {
    const points = [];
    const steps = 80;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const [x, y] = bezier(p0, p1, p2, p3, t);
      const [x2, y2] = bezier(p0, p1, p2, p3, Math.min(1, t + 0.01));
      const length = Math.hypot(x2 - x, y2 - y) || 1;
      const nx = -(y2 - y) / length, ny = (x2 - x) / length;
      // L'ondulation s'estompe aux extrémités pour des départs et des pointes nettes.
      const envelope = Math.sin(Math.PI * t);
      const offset = amplitude * envelope * Math.sin(phase + t * waves * 2 * Math.PI);
      points.push(`${(x + nx * offset).toFixed(1)} ${(y + ny * offset).toFixed(1)}`);
    }
    return `M ${points.join(" L ")}`;
  }

  // Chevelure : des mèches ondulées suivent des arcs concentriques autour de la tête. Elles partent
  // de la raie au milieu, couvrent les tempes et finissent derrière la mâchoire.
  const lerp = (a, b, t) => a + (b - a) * t;
  const inner = { cx: 512, cy: 446, rx: 126, ry: 96 };   // bord du visage (ligne des cheveux)
  const outer = { cx: 512, cy: 430, rx: 226, ry: 258 };  // contour de la coiffure
  const STRANDS = 12;

  function arcPoint(k, angleDeg) {
    const t = k / (STRANDS - 1);
    const a = (angleDeg * Math.PI) / 180;
    return [lerp(inner.cx, outer.cx, t) + lerp(inner.rx, outer.rx, t) * Math.cos(a), lerp(inner.cy, outer.cy, t) + lerp(inner.ry, outer.ry, t) * Math.sin(a)];
  }

  for (const side of [-1, 1]) {
    for (let k = 0; k < STRANDS; k++) {
      const t = k / (STRANDS - 1);
      // Angles en degrés, 0° à droite, -90° en haut. Le côté gauche tourne vers -180° et au-delà.
      const reach = lerp(20, 40, t);                    // jusque derrière la mâchoire
      const startAngle = side < 0 ? -92 : -88;          // à la raie
      const endAngle = side < 0 ? -180 - reach : reach;
      const points = [];
      const steps = 90;
      for (let i = 0; i <= steps; i++) {
        const u = i / steps;
        const angle = lerp(startAngle, endAngle, u);
        const [x, y] = arcPoint(k, angle);
        // Ondulation le long du rayon, qui s'estompe à la raie.
        const wave = 6 * Math.min(1, u * 4) * Math.sin(u * 6.5 * Math.PI + k * 0.7);
        const dx = x - 512, dy = y - 440, length = Math.hypot(dx, dy) || 1;
        points.push(`${(x + (dx / length) * wave).toFixed(1)} ${(y + (dy / length) * wave).toFixed(1)}`);
      }
      add("hair", "path", { class: "ink", "stroke-width": k === STRANDS - 1 ? 5.5 : 4.1, d: `M ${points.join(" L ")}` });
    }
    // Rouleaux bouclés le long du contour extérieur.
    for (let angle = -74; angle <= 38; angle += 16) {
      const a = side < 0 ? 180 - angle : angle;
      const [x, y] = arcPoint(STRANDS - 1, a);
      const radius = 24;
      // Centre un peu à l'extérieur du contour : les rouleaux forment une bordure festonnée.
      const dx = x - 512, dy = y - 430, length = Math.hypot(dx, dy);
      const cx = x + (dx / length) * 16, cy = y + (dy / length) * 16;
      add("hair", "path", { class: "ink", "stroke-width": 4.1, d: spiral(cx, cy, radius, side) });
    }
    // Mèches qui tombent derrière le cou, terminées par une spirale.
    for (const [offset, length] of [[0, 0], [34, 40]]) {
      const x = 512 + side * (150 + offset);
      const endY = 700 + length;
      add("hair", "path", { class: "ink", "stroke-width": 4.1, d: `M ${x} 600 C ${x + side * 18} 630, ${x - side * 16} 660, ${x + side * 4} ${endY - 20}` });
      add("hair", "path", { class: "ink", "stroke-width": 4.1, d: spiral(x + side * 14, endY, 16, side) });
    }
  }

  /** Spirale (boucle de cheveux, extrémité du rouleau). */
  function spiral(cx, cy, radius, direction) {
    const points = [];
    for (let i = 0; i <= 60; i++) {
      const t = i / 60;
      const angle = direction * t * 2.2 * 2 * Math.PI;
      const r = radius * (1 - t * 0.85);
      points.push(`${(cx + r * Math.cos(angle)).toFixed(1)} ${(cy + r * Math.sin(angle)).toFixed(1)}`);
    }
    return `M ${points.join(" L ")}`;
  }

  // Yeux sereins, paupières lourdes, à la manière des statues classiques.
  for (const side of [-1, 1]) {
    const cx = 512 + side * 62;
    add("eyes", "path", { class: "ink", "stroke-width": 4.8, d: `M ${cx - 36} 456 C ${cx - 18} 438, ${cx + 18} 438, ${cx + 36} 454` });
    add("eyes", "path", { class: "ink", "stroke-width": 3.4, d: `M ${cx - 34} 458 C ${cx - 14} 470, ${cx + 14} 470, ${cx + 34} 456` });
    add("eyes", "path", { class: "ink", "stroke-width": 2.8, d: `M ${cx - 30} 440 C ${cx - 12} 426, ${cx + 14} 426, ${cx + 32} 438` });
    add("eyes", "path", { class: "ink", "stroke-width": 4.1, d: `M ${cx - 10} 446 C ${cx - 10} 462, ${cx + 10} 462, ${cx + 10} 446` });
  }

  // Diadème : bandeau doré posé sur la chevelure, orné de petites perles.
  {
    const band = (k) => {
      const points = [];
      for (let angle = -150; angle <= -30; angle += 4) points.push(arcPoint(k, angle));
      return points;
    };
    const top = band(3.1), bottom = band(2.2);
    const toPath = (points) => points.map(([x, y], i) => `${i ? "L" : "M"} ${x.toFixed(1)} ${y.toFixed(1)}`).join(" ");
    add("diadem", "path", { fill: "#1f3456", stroke: "none", d: `${toPath(top)} ${toPath([...bottom].reverse()).replace("M", "L")} Z` });
    add("diadem", "path", { class: "gold", "stroke-width": 4.1, d: toPath(top) });
    add("diadem", "path", { class: "gold", "stroke-width": 4.1, d: toPath(bottom) });
    const middle = band(2.65);
    for (let i = 2; i < middle.length - 2; i += 3) add("diadem", "circle", { cx: middle[i][0], cy: middle[i][1], r: 4.5, fill: "#e0b866" });
  }

  // Rouleau : la feuille, quelques lignes d'écriture, deux extrémités enroulées.
  add("scroll", "path", { fill: "#1e3352", stroke: "none", d: "M 400 800 L 624 800 L 624 850 L 400 850 Z" });
  add("scroll", "path", { class: "ink", "stroke-width": 4.8, d: "M 400 800 L 624 800 M 400 850 L 624 850" });
  add("scroll", "path", { class: "ink", "stroke-width": 2.8, d: "M 432 818 L 592 818 M 432 832 L 560 832" });
  for (const [cx, direction] of [[388, -1], [636, 1]]) {
    add("scroll", "ellipse", { cx, cy: 825, rx: 22, ry: 32, fill: "#1e3352", stroke: "#e0b866", "stroke-width": 4.8 });
    add("scroll", "path", { class: "gold", "stroke-width": 3.4, d: spiral(cx, 825, 18, direction) });
  }

  // Frise : deux filets et un méandre continu entre eux.
  const friezeTop = 922, unit = 64; // (« top » est réservé : window.top)
  let meander = "";
  for (let x = 16; x < 1024; x += unit) {
    meander += `M ${x} ${friezeTop + 56} L ${x} ${friezeTop + 8} L ${x + 48} ${friezeTop + 8} L ${x + 48} ${friezeTop + 44} L ${x + 16} ${friezeTop + 44} L ${x + 16} ${friezeTop + 26} L ${x + 30} ${friezeTop + 26} `;
  }
  document.getElementById("frieze").innerHTML = `
    <path class="gold" stroke-width="4" d="M 0 ${friezeTop - 8} H 1024 M 0 ${friezeTop + 72} H 1024"/>
    <path class="gold" stroke-width="6.5" stroke-linecap="square" d="${meander}"/>`;

  if (new URLSearchParams(location.search).has("safe")) {
    document.getElementById("portrait").setAttribute("transform", "translate(512 500) scale(0.8) translate(-512 -500)");
    document.getElementById("frieze").setAttribute("transform", "translate(102 -150) scale(0.8)");
  }
</script>
</body>
</html>
