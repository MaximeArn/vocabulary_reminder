<!doctype html>
<!--
  Source de l'icône de l'app. Rendue en PNG par generate-icons.mjs
  (Chrome headless), avec la vraie police Literata du projet.
  Paramètre ?safe=1 : version « maskable », motif réduit dans la zone sûre.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Literata";
    font-style: italic;
    font-weight: 200 900;
    src: url(../../node_modules/@fontsource-variable/literata/files/literata-latin-opsz-italic.woff2) format("woff2");
  }
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; }
  .icon {
    position: relative;
    width: 1024px; height: 1024px;
    background: #f5f0e6;
    display: grid; place-items: center;
  }
  .letter {
    font-family: "Literata";
    font-style: italic;
    font-weight: 500;
    font-variation-settings: "opsz" 72;
    font-size: 700px;
    line-height: 1;
    color: #1f3350;
    transform: translate(-18px, -30px);
  }
  .ribbon {
    position: absolute;
    top: 0; right: 230px;
    width: 92px; height: 300px;
    background: #a8452c;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
  }
  .safe .letter { font-size: 520px; }
  .safe .ribbon { right: 300px; width: 72px; height: 290px; }
</style>
</head>
<body>
  <div class="icon" id="icon"><span class="letter">L</span><span class="ribbon"></span></div>
  <script>
    if (new URLSearchParams(location.search).has("safe")) document.getElementById("icon").classList.add("safe");
  </script>
</body>
</html>
